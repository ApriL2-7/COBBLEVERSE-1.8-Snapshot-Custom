plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modCompileOnly files('../mods/fabric-1.8.0+1.21.1-20260824.133257-119.jar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

tasks.register('priorityPolicyTest', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free regional evolution priority self-test.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'kr.cobbleverse.evolution.RegionalEvolutionPrioritySelfTest'
}

tasks.register('installLocal', Copy) {
    group = 'distribution'
    description = 'Copies the remapped server hotfix into the local server pack mods directory.'
    dependsOn remapJar
    from(tasks.remapJar.archiveFile)
    into('../mods')
}

check.dependsOn priorityPolicyTest

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
